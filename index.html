<!doctype html>
<html lang="en" data-theme="dark-plus" data-theme-type="dark" class="vs-dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
  <meta name="theme-color" content="#3c3c3c" />
  <meta name="color-scheme" content="dark light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="X Coder" />
  <meta name="format-detection" content="telephone=no, email=no, address=no" />
  <meta name="description" content="X Coder — a VS Code–style IDE for iPhone and the browser with local projects, live preview, terminal, GitHub source control and an AI coding agent." />
  <title>X Coder</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <script>
    // Apply the saved color theme before first paint (no flash).
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('xcoder.settings.v6') || '{}');
        var light = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
        var legacy = localStorage.getItem('xcoderTheme');
        var id = s['workbench.colorTheme'] || (legacy === 'light' ? 'light-plus' : 'dark-plus');
        if (s['window.autoDetectColorScheme'] || (!s['workbench.colorTheme'] && legacy === 'system')) id = light ? (s['workbench.preferredLightColorTheme'] || 'light-plus') : (s['workbench.preferredDarkColorTheme'] || 'dark-plus');
        var type = /^light/.test(id) ? 'light' : 'dark';
        var d = document.documentElement;
        d.setAttribute('data-theme', id); d.setAttribute('data-theme-type', type);
        d.className = id === 'hc-black' ? 'hc-black' : type === 'light' ? 'vs' : 'vs-dark';
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./vendor/codicons/codicon.css" />
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/workbench.css" />
  <link rel="stylesheet" href="./css/widgets.css" />
  <link rel="stylesheet" href="./css/editor.css" />
  <link rel="stylesheet" href="./css/explorer.css" />
  <link rel="stylesheet" href="./css/search.css" />
  <link rel="stylesheet" href="./css/scm.css" />
  <link rel="stylesheet" href="./css/panel.css" />
  <link rel="stylesheet" href="./css/preview.css" />
  <link rel="stylesheet" href="./css/chat.css" />
  <link rel="stylesheet" href="./css/welcome.css" />
  <link rel="stylesheet" href="./css/settings.css" />
  <link rel="stylesheet" href="./css/extensions.css" />
  <link rel="modulepreload" href="./vendor/codemirror.js" />
  <script id="puter-js" src="https://js.puter.com/v2/" async></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <noscript>X Coder needs JavaScript.</noscript>

  <div id="boot-screen" class="boot-screen" aria-live="polite" aria-label="Loading X Coder">
    <div class="boot-letterpress"></div>
    <div class="boot-progress monaco-progress-container active infinite"><div class="progress-bit"></div></div>
  </div>

  <div id="workbench" class="monaco-workbench">
    <header id="titlebar" class="part titlebar" role="banner"></header>
    <div id="workbench-body" class="workbench-body">
      <nav id="activitybar" class="part activitybar" role="navigation" aria-label="Activity Bar"></nav>
      <aside id="sidebar" class="part sidebar" role="complementary" aria-label="Primary Side Bar"></aside>
      <div id="sash-sidebar" class="sash vertical" role="separator" aria-orientation="vertical"></div>
      <div id="main-column" class="main-column">
        <main id="editor-part" class="part editor" aria-label="Editor"></main>
        <div id="sash-panel" class="sash horizontal" role="separator" aria-orientation="horizontal"></div>
        <section id="panel" class="part panel" aria-label="Panel"></section>
      </div>
      <div id="sash-aux" class="sash vertical" role="separator" aria-orientation="vertical"></div>
      <aside id="auxiliarybar" class="part auxiliarybar" role="complementary" aria-label="Secondary Side Bar"></aside>
      <div id="overlay-backdrop" class="overlay-backdrop"></div>
    </div>
    <footer id="statusbar" class="part statusbar" role="status" aria-label="Status Bar"></footer>
  </div>
</body>
</html>
