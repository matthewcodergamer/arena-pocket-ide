name = "arena-pocket-ide-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# Browser Origin header contains only scheme + host, not /arena-pocket-ide/.
ALLOWED_ORIGIN = "https://matthewcodergamer.github.io"

# Crain is intentionally locked server-side to one free-tier model.
# Do not expose GEMINI_API_KEY here; keep it as a Cloudflare Secret.
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta"
GEMINI_MODEL = "gemini-2.5-pro"

REQUESTS_PER_MINUTE = "20"
REQUEST_TIMEOUT_MS = "90000"
