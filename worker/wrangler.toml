# Keep this service name so the existing workers.dev URL and GitHub deployment stay intact.
name = "arena-pocket-ide-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
ALLOWED_ORIGIN = "https://matthewcodergamer.github.io"

# Public API addresses. API keys remain encrypted Cloudflare Secrets.
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta"
GROQ_API_BASE = "https://api.groq.com/openai/v1"
OPENROUTER_API_BASE = "https://openrouter.ai/api/v1"
MISTRAL_API_BASE = "https://api.mistral.ai/v1"
SAMBANOVA_API_BASE = "https://api.sambanova.ai/v1"

# Existing Gemini setting remains supported; the router can fail over to other providers.
GEMINI_MODEL = "gemini-3.7-flash"
CLOUDFLARE_MODEL = "@cf/qwen/qwen2.5-coder-32b-instruct"
FREE_ONLY = "true"
MAX_ROUTE_ATTEMPTS = "6"
REQUESTS_PER_MINUTE = "20"
REQUEST_TIMEOUT_MS = "90000"

# No API key is needed for this provider. Cloudflare exposes it to the Worker as env.AI.
[ai]
binding = "AI"
